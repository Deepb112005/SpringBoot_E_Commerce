spring.application.name=sb-ecom

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update


project.image=images/

spring.app.jwtSecret=${JWT_SECRET:mySecretKey123912738sths36eth43sr4t3h648st3b48sthbzserhb}
spring.app.jwtExpiration=${JWT_EXPIRATION:3000000000000}


logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.social.securitydemo=DEBUG
